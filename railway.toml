[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Required environment variables (set in Railway dashboard, on the backend service):
# OPENAI_API_KEY        — OpenAI API key with Realtime access. Never commit this.
# MCP_SERVER_PUBLIC_URL — set to: https://${{ RAILWAY_PUBLIC_DOMAIN }}
#                          (Railway reference-variable syntax; resolves to this
#                          service's own public domain, so it never needs manual
#                          updating across redeploys, unlike an ngrok URL)
#
# CORS_ALLOWED_ORIGINS is NOT required — it defaults to the live frontend's origin
# (https://mywhisper.drmilkin.workers.dev) plus localhost:4200 for dev, baked into
# application.properties since an origin isn't sensitive. Only set this var if you
# need to override that default (e.g. a one-off staging origin).
